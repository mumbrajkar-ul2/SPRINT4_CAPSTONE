id: rule.open_flag.impl.night_batch
kind: business_rule
statement: Night batch flags REVIEW and HOLD. That matches BO-06a.
inputs:
- name: status
  term: term.open_operational
decision_table:
- when:
    status: REVIEW
  then:
    flagged: true
    route: OPEN
- when:
    status: HOLD
  then:
    flagged: true
    route: OPEN
- when:
    status: CLOSED
  then:
    flagged: false
authority: sme
owner: SME
policy_status: decided
tests:
- given:
    status: REVIEW
  expect:
    flagged: true
    route: OPEN
- given:
    status: HOLD
  expect:
    flagged: true
    route: OPEN
- given:
    status: CLOSED
  expect:
    flagged: false
