id: rule.region.site_canonical
kind: business_rule
statement: Site code is the canonical location key. Country and sales region are derived
  from the site. IN-BLR derives country IN and sales region APAC. US-TX derives US
  and AMER. DE-BY derives DE and EMEA. GB-ENG derives GB and EMEA. BR-SP derives BR
  and AMER. JP-KN derives JP and APAC.
