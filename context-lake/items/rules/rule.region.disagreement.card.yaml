id: rule.region.disagreement
kind: business_rule
statement: Site and stored region disagreement waits. AU and ZA wait.
inputs:
- name: site
  term: term.site_code
- name: sales_region
  term: term.sales_region
decision_table:
- when:
    disagree: true
  then:
    route: HOLD_FOR_REVIEW
authority: sme
owner: SME
policy_status: decided
tests:
- given:
    site: IN-BLR
    stored_sales_region: AMER
  expect:
    route: HOLD_FOR_REVIEW
- given:
    country: AU
    site: null
  expect:
    route: HOLD_FOR_REVIEW
- given:
    country: ZA
    site: null
  expect:
    route: HOLD_FOR_REVIEW
observed_implementations: []
