- term_id: term.site_code
  canonical_name: site code
  definition: Site code is the canonical location key. The six codes are BR-SP, DE-BY,
    GB-ENG, IN-BLR, JP-KN, and US-TX.
  local_names:
  - system: cases
    field_or_word: site
    meaning: Stored site code
  - system: fab_tools
    field_or_word: chamber
    meaning: Packaged chamber holds a site code
  - system: Python
    field_or_word: absent
    meaning: legacy_logic.py has no site argument
  - system: JavaScript
    field_or_word: absent
    meaning: legacy_policy.js keys on archive region
  - system: Java
    field_or_word: absent
    meaning: ReconcileLegacy.java has no site field
  - system: night batch
    field_or_word: absent
    meaning: The job joins on country, not site
  - system: MESDispatch
    field_or_word: absent
    meaning: No site field in domain-profile.json
  - system: PLM-Metrology
    field_or_word: absent
    meaning: No site field in domain-profile.json
  authority: sme
  policy_status: decided
  claim: verified_fact
  source_path: docs/11-data-context/mapping-design.md
- term_id: term.country_code
  canonical_name: country code
  definition: Country is derived from the site prefix. Packaged country codes are
    AU, BR, DE, GB, IN, JP, US, and ZA. AU and ZA have no site.
  local_names:
  - system: policy_register
    field_or_word: region
    meaning: Country code
  - system: operational_objects
    field_or_word: region
    meaning: Country code
  - system: organizations
    field_or_word: region
    meaning: Country code
  - system: Python
    field_or_word: absent
    meaning: No country argument
  - system: JavaScript
    field_or_word: absent
    meaning: Uses APAC, EMEA, AMER
  - system: Java
    field_or_word: absent
    meaning: No country field
  - system: night batch
    field_or_word: operational_objects.region
    meaning: Join key
  - system: MESDispatch
    field_or_word: absent
    meaning: No country list
  - system: PLM-Metrology
    field_or_word: absent
    meaning: No country list
  authority: sme
  policy_status: decided
  claim: verified_fact
  source_path: docs/11-data-context/mapping-design.md
  maps_to_term: term.site_code
- term_id: term.sales_region
  canonical_name: sales region
  definition: Sales regions are APAC, EMEA, and AMER. recipe_release binds at this
    scope.
  local_names:
  - system: cases
    field_or_word: region
    meaning: Stored sales region, assigned independently of site
  - system: archive
    field_or_word: region
    meaning: APAC, EMEA, AMER
  - system: Python
    field_or_word: absent
    meaning: No region argument
  - system: JavaScript
    field_or_word: region
    meaning: Archive region argument
  - system: Java
    field_or_word: absent
    meaning: No region field
  - system: night batch
    field_or_word: absent
    meaning: Joins on country
  - system: MESDispatch
    field_or_word: absent
    meaning: No sales region
  - system: PLM-Metrology
    field_or_word: absent
    meaning: No sales region
  authority: sme
  policy_status: decided
  claim: verified_fact
  source_path: docs/11-data-context/mapping-design.md
  maps_to_term: term.site_code
